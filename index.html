<!DOCTYPE html>

<body class="home">

<section class="hero">

      <div class="brand-row">
        <img class="logo-mark" src="images/logo-nr.png" alt="NR">

      <p class="brand-tagline">Developer&nbsp;&ndash; Designer&nbsp;&ndash; Student</p>

    <ul class="hero-nav">

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>
