  <h1 class="page-title">In progress</h1>
  <p class="page-subtitle">The projects that you're currently seeing are</p>

  <div id="list"></div>
</div>

<script src="js/cards.js"></script>
<script src="js/scroll-focus.js"></script>
<script>
(async function () {
  const listEl = document.getElementById('list');
  const projects = await fetchProjects();
  const inProgress = projects
    .filter(p => p.status === 'in-progress')
    .sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  if (inProgress.length === 0) {
    listEl.innerHTML = '<div class="empty-state">Aucun projet en cours pour le moment.</div>';
    return;
  }

  listEl.innerHTML = inProgress.map(p => `<div class="inprogress-item">${renderCard(p)}${renderPhaseCard(p)}</div>`).join('');
  if (window.updateCardFocus) window.updateCardFocus();
})();
</script>
</body>
